[platformio]
default_envs = boat1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.0
    me-no-dev/ESPAsyncWebServer @ ^1.2.4
    me-no-dev/AsyncTCP @ ^1.1.1
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit MPU6050 @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; =========================================================================
; Predefined Environment 1: BOAT-001 (Vessel Alpha)
; Upload Command: pio run -e boat1 -t upload
; Wi-Fi SSID:     SeaLink-BOAT-001 (Password: maritime123)
; Gateway IP:     192.168.4.1
; =========================================================================
[env:boat1]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D THIS_BOAT_ID=\"BOAT-001\"
    -D IS_SHORE_GATEWAY=false

; =========================================================================
; Predefined Environment 2: BOAT-104 (Vessel Bravo)
; Upload Command: pio run -e boat2 -t upload
; Wi-Fi SSID:     SeaLink-BOAT-104 (Password: maritime123)
; Gateway IP:     192.168.5.1
; =========================================================================
[env:boat2]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D THIS_BOAT_ID=\"BOAT-104\"
    -D IS_SHORE_GATEWAY=false

; =========================================================================
; Predefined Environment 3: Coastal Shore Station (Supabase Cloud Uplink)
; Upload Command: pio run -e shore -t upload
; Wi-Fi SSID:     SeaLink-SHORE-BASE (Password: maritime123)
; Gateway IP:     192.168.6.1
; =========================================================================
[env:shore]
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D THIS_BOAT_ID=\"SHORE-BASE\"
    -D IS_SHORE_GATEWAY=true
